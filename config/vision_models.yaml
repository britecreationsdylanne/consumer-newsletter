# =============================================================================
# IMAGE GENERATION MODELS
# =============================================================================
# Dedicated image-generation catalog (indexed by model_config alongside providers)
image_generation_models:
  openai:
    name: "OpenAI"
    env_key: "OPENAI_API_KEY"
    models:
      # Active - current OpenAI image model (released 2026-04)
      - id: "gpt-image-2"
        name: "GPT Image 2"
        type: "image-generation"
        status: "active"
        notes: "Current OpenAI image model. ~$0.01 (low) / ~$0.06 (medium) / ~$0.22 (high) per 1024x1024 image. Up to 4K, >95% in-image text accuracy, native transparent PNG output."

      - id: "gpt-image-1.5"
        name: "GPT Image 1.5"
        type: "image-generation"
        status: "deprecated"
        replaced_by: "gpt-image-2"
        notes: "Superseded by GPT Image 2."

      - id: "gpt-image-1"
        name: "GPT Image 1"
        type: "image-generation"
        status: "deprecated"
        replaced_by: "gpt-image-2"
        notes: "Original GPT Image model. Superseded by GPT Image 2."

  google:
    name: "Google (Gemini / Imagen)"
    env_key: "GOOGLE_AI_API_KEY"
    models:
      # Active - used as image-generation fallback
      - id: "gemini-2.5-flash-image"
        name: "Gemini 2.5 Flash Image"
        type: "image-generation"
        status: "active"
        notes: "Nano Banana. Multimodal image generation via Gemini. Used as fallback when OpenAI is unavailable."

      - id: "gemini-3-pro-image-preview"
        name: "Gemini 3 Pro Image Preview"
        type: "image-generation"
        status: "deprecated"
        replaced_by: "gpt-image-2"
        notes: "Previous meme/illustration model. Image generation moved to GPT Image 2."


# Benchmark Test Groups
# Define model groups for A/B testing
# ONLY INCLUDES VALIDATED WORKING MODELS
benchmark_groups:
  # Economy tier - cheapest models for high-volume tasks
  economy_tier:
    description: "Cheapest validated models for high-volume tasks"
    models:
      - "gpt-4o-mini"
      - "gpt-4.1-nano"
      - "claude-haiku-4-5-20251001"

  # Standard tier - balanced cost/performance
  standard_tier:
    description: "Balanced cost/performance validated models"
    models:
      - "gemini-2.5-flash"
      - "gpt-4o"
      - "claude-sonnet-4-6"

  # Frontier tier - highest capability
  frontier_tier:
    description: "Highest capability validated models"
    models:
      - "gpt-5.5"
      - "claude-opus-4-8"

  # OpenAI comparison - all tiers
  openai_versions:
    description: "Compare OpenAI model generations"
    models:
      - "gpt-5.5"
      - "gpt-5-mini"
      - "gpt-4.1"
      - "gpt-4o"
      - "gpt-4o-mini"

  # OpenAI economy options
  openai_economy:
    description: "Compare OpenAI economy models"
    models:
      - "gpt-5-mini"
      - "gpt-4.1-nano"
      - "gpt-4o-mini"

  # Claude comparison
  claude_versions:
    description: "Compare Claude model tiers"
    models:
      - "claude-opus-4-8"
      - "claude-sonnet-4-6"
      - "claude-haiku-4-5-20251001"

  # Gemini comparison - all versions
  gemini_versions:
    description: "Compare Gemini model generations"
    models:
      - "gemini-3-pro-preview"
      - "gemini-3-flash-preview"
      - "gemini-2.5-pro"
      - "gemini-2.5-flash"
      - "gemini-2.0-flash"
      - "gemini-2.0-flash-lite"

  # Gemini Flash comparison
  gemini_flash_versions:
    description: "Compare Gemini Flash models (3 vs 2.5 vs 2.0)"
    models:
      - "gemini-3-flash-preview"
      - "gemini-2.5-flash"
      - "gemini-2.0-flash"

  # Gemini Pro comparison
  gemini_pro_versions:
    description: "Compare Gemini Pro models"
    models:
      - "gemini-3-pro-preview"
      - "gemini-2.5-pro"

  # Default for classification benchmarks
  classification_default:
    description: "Recommended validated models for document classification"
    models:
      - "gemini-2.5-flash"        # Fast, cheap, good vision
      - "claude-sonnet-4-6"       # Strong reasoning
      - "gpt-4o-mini"             # Cost-effective

  # Full cross-provider comparison (validated only)
  full_comparison:
    description: "All validated models across providers"
    models:
      # Frontier
      - "gpt-5.5"
      - "claude-opus-4-8"
      # Standard
      - "gemini-2.5-flash"
      - "gpt-4o"
      - "claude-sonnet-4-6"
      # Economy
      - "gpt-4o-mini"
      - "claude-haiku-4-5-20251001"

