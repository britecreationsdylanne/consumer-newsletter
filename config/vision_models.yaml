# Vision Models Reference
# ======================
# Catalog of vision-capable models across providers for benchmarking
# The 'id' field is the exact string to send to the API
# VALIDATED: 2026-01-09 - Only models with status "active" have been tested and work
# Last Updated: 2026-06-05 - Synced to current models (GPT-5.5, Claude Opus 4.8, Gemini 2.5);
#   image generation moved to OpenAI GPT Image 2 (gpt-image-2) with Gemini 2.5 Flash Image fallback.
#   New/replacement models marked active; superseded models marked deprecated with replaced_by.

providers:
  google:
    name: "Google (Gemini)"
    env_key: "GOOGLE_API_KEY"
    models:
      # Gemini 3 Series (Preview) - VALIDATED WORKING
      - id: "gemini-3-pro-preview"
        name: "Gemini 3 Pro Preview"
        tier: "frontier"
        speed: "medium"
        context_window: 1000000
        vision: true
        status: "active"
        notes: "VALIDATED - Cutting-edge multimodal understanding"
        cost_per_1m_input: 1.25
        cost_per_1m_output: 5.00

      - id: "gemini-3-flash-preview"
        name: "Gemini 3 Flash Preview"
        tier: "standard"
        speed: "fast"
        context_window: 1000000
        vision: true
        status: "active"
        notes: "VALIDATED - Fast/cheap - good for OCR tasks"
        cost_per_1m_input: 0.10
        cost_per_1m_output: 0.40

      - id: "gemini-3-pro-image-preview"
        name: "Gemini 3 Pro Image Preview"
        tier: "frontier"
        speed: "medium"
        context_window: 1000000
        vision: true
        image_generation: true
        status: "active"
        notes: "Image generation model - for memes, illustrations"
        cost_per_1m_input: 1.25
        cost_per_1m_output: 5.00

      # Gemini 2.5 Series - VALIDATED WORKING
      - id: "gemini-2.5-pro"
        name: "Gemini 2.5 Pro"
        tier: "frontier"
        speed: "medium"
        context_window: 1000000
        vision: true
        status: "active"
        notes: "VALIDATED - Deep reasoning capabilities"
        cost_per_1m_input: 1.25
        cost_per_1m_output: 5.00

      - id: "gemini-2.5-flash"
        name: "Gemini 2.5 Flash"
        tier: "standard"
        speed: "fast"
        context_window: 1000000
        vision: true
        status: "active"
        notes: "VALIDATED - Balanced performance"
        cost_per_1m_input: 0.15
        cost_per_1m_output: 0.60

      # Gemini 2.0 Series - WORKING
      - id: "gemini-2.0-flash"
        name: "Gemini 2.0 Flash"
        tier: "standard"
        speed: "fast"
        context_window: 1000000
        vision: true
        status: "deprecated"
        replaced_by: "gemini-2.5-flash"
        notes: "Shutdown 2026-03-31 - use Gemini 2.5 Flash"
        cost_per_1m_input: 0.10
        cost_per_1m_output: 0.40

      - id: "gemini-2.0-flash-lite"
        name: "Gemini 2.0 Flash Lite"
        tier: "economy"
        speed: "fastest"
        context_window: 1000000
        vision: true
        status: "deprecated"
        replaced_by: "gemini-2.5-flash"
        notes: "Shutdown 2026-03-31 - use Gemini 2.5 Flash"
        cost_per_1m_input: 0.02
        cost_per_1m_output: 0.10

      # Legacy
      - id: "gemini-1.5-flash"
        name: "Gemini 1.5 Flash"
        tier: "legacy"
        speed: "fast"
        context_window: 1000000
        vision: true
        status: "deprecated"
        notes: "Retired April 2025 - use 2.0+ instead"
        cost_per_1m_input: 0.075
        cost_per_1m_output: 0.30

      - id: "gemini-1.5-pro"
        name: "Gemini 1.5 Pro"
        tier: "legacy"
        speed: "medium"
        context_window: 2000000
        vision: true
        status: "deprecated"
        notes: "Retired April 2025 - use 2.0+ instead"
        cost_per_1m_input: 1.25
        cost_per_1m_output: 5.00

  openai:
    name: "OpenAI"
    env_key: "OPENAI_API_KEY"
    models:
      # GPT-5.5 Series - Current frontier (released 2026-04-23)
      - id: "gpt-5.5"
        name: "GPT-5.5"
        tier: "frontier"
        speed: "medium"
        context_window: 1050000
        max_output: 128000
        vision: true
        status: "active"
        notes: "Current frontier model. 1.05M context (272k at standard pricing). Text+image input, function calling, structured output. Uses max_completion_tokens"
        cost_per_1m_input: 5.00
        cost_per_1m_output: 30.00

      # GPT-5.2 Series - Retired 2026-06-05 (superseded by GPT-5.5)
      - id: "gpt-5.2"
        name: "GPT-5.2"
        tier: "frontier"
        speed: "medium"
        context_window: 400000
        max_output: 128000
        vision: true
        status: "deprecated"
        replaced_by: "gpt-5.5"
        notes: "Superseded by GPT-5.5 (retired 2026-06-05). Uses max_completion_tokens"
        cost_per_1m_input: 1.75
        cost_per_1m_output: 14.00

      # GPT-5.2 Turbo - Not found (404), may not exist
      - id: "gpt-5.2-turbo"
        name: "GPT-5.2 Turbo"
        tier: "frontier"
        speed: "fast"
        context_window: 400000
        vision: true
        status: "unavailable"
        notes: "404 - Model not found. May not exist or different name."
        cost_per_1m_input: 1.25
        cost_per_1m_output: 10.00

      # GPT-5 Mini - Economy variant
      - id: "gpt-5-mini"
        name: "GPT-5 Mini"
        tier: "economy"
        speed: "fastest"
        context_window: 400000
        vision: true
        status: "active"
        notes: "Cost-efficient GPT-5. Uses max_completion_tokens"
        cost_per_1m_input: 0.10
        cost_per_1m_output: 0.40

      # GPT-4.1 Series - WORKING
      - id: "gpt-4.1"
        name: "GPT-4.1"
        tier: "standard"
        speed: "medium"
        context_window: 128000
        vision: true
        status: "active"
        notes: "VALIDATED - Frontier model with vision, fine-tunable"
        cost_per_1m_input: 2.00
        cost_per_1m_output: 8.00

      - id: "gpt-4.1-mini"
        name: "GPT-4.1 Mini"
        tier: "standard"
        speed: "fast"
        context_window: 128000
        vision: true
        status: "active"
        notes: "VALIDATED - Efficient mid-tier model"
        cost_per_1m_input: 0.40
        cost_per_1m_output: 1.60

      - id: "gpt-4.1-nano"
        name: "GPT-4.1 Nano"
        tier: "economy"
        speed: "fastest"
        context_window: 128000
        vision: true
        status: "active"
        notes: "VALIDATED - Ultra-fast, cost-efficient"
        cost_per_1m_input: 0.10
        cost_per_1m_output: 0.40

      # GPT-4o Series - WORKING
      - id: "gpt-4o"
        name: "GPT-4o"
        tier: "standard"
        speed: "fast"
        context_window: 128000
        vision: true
        status: "active"
        notes: "VALIDATED - Omni model - text, audio, image, video"
        cost_per_1m_input: 2.50
        cost_per_1m_output: 10.00

      - id: "gpt-4o-mini"
        name: "GPT-4o Mini"
        tier: "economy"
        speed: "fast"
        context_window: 128000
        vision: true
        status: "active"
        notes: "VALIDATED - 60% cheaper than GPT-3.5 Turbo, great for focused tasks"
        cost_per_1m_input: 0.15
        cost_per_1m_output: 0.60

      # Legacy
      - id: "gpt-4-turbo"
        name: "GPT-4 Turbo"
        tier: "legacy"
        speed: "medium"
        context_window: 128000
        vision: true
        status: "active"
        notes: "VALIDATED - Previous generation, still supported"
        cost_per_1m_input: 10.00
        cost_per_1m_output: 30.00

  anthropic:
    name: "Anthropic (Claude)"
    env_key: "ANTHROPIC_API_KEY"
    models:
      # Claude Opus 4.8 - Current frontier (GA 2026-05-30)
      - id: "claude-opus-4-8"
        name: "Claude Opus 4.8"
        tier: "frontier"
        speed: "slow"
        context_window: 1000000
        max_output: 128000
        vision: true
        status: "active"
        notes: "Current most capable model. 1M context, 128k max output. Best vision/reasoning/writing. New fast mode at $10/$50 per 1M"
        cost_per_1m_input: 5.00
        cost_per_1m_output: 25.00

      # Claude Opus 4.5 - Superseded by 4.8
      - id: "claude-opus-4-5-20251101"
        name: "Claude Opus 4.5"
        tier: "frontier"
        speed: "slow"
        context_window: 200000
        vision: true
        status: "deprecated"
        replaced_by: "claude-opus-4-8"
        notes: "Superseded by Opus 4.8 (2026-05-30)"
        cost_per_1m_input: 5.00
        cost_per_1m_output: 25.00

      # Claude Sonnet 4.6 - Current standard (released 2026-02-17)
      - id: "claude-sonnet-4-6"
        name: "Claude Sonnet 4.6"
        tier: "standard"
        speed: "medium"
        context_window: 200000
        max_output: 64000
        vision: true
        status: "active"
        notes: "Current Sonnet - near-Opus coding/agents performance. 1M context beta available"
        cost_per_1m_input: 3.00
        cost_per_1m_output: 15.00

      # Claude Sonnet 4 - Superseded by Sonnet 4.6
      - id: "claude-sonnet-4-20250514"
        name: "Claude Sonnet 4"
        tier: "standard"
        speed: "medium"
        context_window: 200000
        vision: true
        status: "deprecated"
        replaced_by: "claude-sonnet-4-6"
        notes: "Superseded by Sonnet 4.6"
        cost_per_1m_input: 3.00
        cost_per_1m_output: 15.00

      # Claude Haiku 4.5 - Current economy
      - id: "claude-haiku-4-5-20251001"
        name: "Claude Haiku 4.5"
        tier: "economy"
        speed: "fastest"
        context_window: 200000
        vision: true
        status: "active"
        notes: "Current fast/affordable model. Replacement for Claude 3.5 Haiku"
        cost_per_1m_input: 1.00
        cost_per_1m_output: 5.00

      # Claude 3.5 Haiku - Retired 2026-02-19
      - id: "claude-3-5-haiku-20241022"
        name: "Claude 3.5 Haiku"
        tier: "economy"
        speed: "fastest"
        context_window: 200000
        vision: true
        status: "deprecated"
        replaced_by: "claude-haiku-4-5-20251001"
        notes: "Retired 2026-02-19 - use Claude Haiku 4.5"
        cost_per_1m_input: 0.80
        cost_per_1m_output: 4.00

      # Legacy/Unavailable
      - id: "claude-3-opus-20240229"
        name: "Claude 3 Opus"
        tier: "legacy"
        speed: "slow"
        context_window: 200000
        vision: true
        status: "deprecated"
        notes: "Deprecated June 2025, retiring Jan 2026"
        cost_per_1m_input: 15.00
