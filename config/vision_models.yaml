# =============================================================================
# TASK ASSIGNMENTS
# =============================================================================
# Maps application tasks to specific models
# Each task has: model (primary), fallback, tier, and optional alternatives

task_assignments:
  # Research & Analysis Tasks
  research_enrichment:
    description: "Frontier analysis layer for Perplexity/Insight Builder/Source Explorer"
    model: "gpt-5.5"
    fallback: "gpt-4.1"
    tier: "frontier"
    economy_alternative: "gpt-4o-mini"
    notes: "Uses max_completion_tokens parameter"

  # Content Generation Tasks
  content_generation:
    description: "Newsletter article writing (News, Tip, Trend sections)"
    model: "claude-opus-4-8"
    fallback: "claude-sonnet-4-6"
    tier: "frontier"
    standard_alternative: "gpt-4o"
    economy_alternative: "gpt-4.1-mini"
    notes: "Runtime writer is Claude Opus 4.8 (frontier) for best brand voice"

  # Brand & Quality Checks
  brand_guidelines_check:
    description: "Check content against brand voice guidelines"
    model: "gpt-4.1-mini"
    fallback: "claude-haiku-4-5-20251001"
    tier: "standard"
    notes: "Strong instruction-following at low cost for validation"

  # Image Analysis (for meme review, etc.)
  image_analysis:
    description: "Analyze images for content appropriateness"
    model: "gpt-4o"
    fallback: "gemini-2.5-flash"
    tier: "standard"
    economy_alternative: "gpt-4o-mini"
    notes: "Needs vision capabilities"

  # Image Generation Prompts
  image_prompt_generation:
    description: "Generate prompts for image creation"
    model: "gpt-4.1-mini"
    fallback: "claude-haiku-4-5-20251001"
    tier: "standard"
    notes: "Creative prompt writing at low cost"

  # Subject Line Generation
  subject_line_generation:
    description: "Generate email subject lines and preheaders"
    model: "gpt-4.1-mini"
    fallback: "claude-haiku-4-5-20251001"
    tier: "standard"
    notes: "Short, punchy creative outputs"

  # Image Generation (newsletter images, memes, Guess the Price, etc.)
  image_generation:
    description: "Generate newsletter images via OpenAI GPT Image 2 with Gemini fallback"
    model: "gpt-image-2"
    fallback: "gemini-2.5-flash-image"
    tier: "frontier"
    notes: "Primary: OpenAI GPT Image 2. Fallback: Gemini 2.5 Flash Image (Nano Banana)"
